ServerName msuscore.msu.ac.th

<VirtualHost *:80>
    DocumentRoot /var/www/html
    ServerName msuscore.msu.ac.th

    <Directory /var/www/html>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted

        # ── Security Headers ──────────────────────────────────
        Header always set X-Content-Type-Options "nosniff"
        Header always set X-Frame-Options "SAMEORIGIN"
        Header always set X-XSS-Protection "1; mode=block"
        Header always set Referrer-Policy "strict-origin-when-cross-origin"
    </Directory>

    # ── ซ่อนไฟล์ที่ไม่ควรเข้าถึงจากภายนอก ────────────────────
    <FilesMatch "\.(env|sql|md|git|log|json)$">
        Require all denied
    </FilesMatch>

    <DirectoryMatch "/(\.git|docker|data)/">
        Require all denied
    </DirectoryMatch>

    # ── ตั้งค่า PHP session ──────────────────────────────────
    php_value session.cookie_httponly 1
    php_value session.use_strict_mode 1

    # ── Log files ────────────────────────────────────────────
    ErrorLog ${APACHE_LOG_DIR}/msuscore_error.log
    CustomLog ${APACHE_LOG_DIR}/msuscore_access.log combined
</VirtualHost>
